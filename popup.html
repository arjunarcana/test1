<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1 class="title">QuickNotes</h1>
    <div class="input-row">
      <input type="text" id="note-input" placeholder="Write a note..." autocomplete="off">
      <button id="add-btn">Add</button>
    </div>
    <div id="notes-list" class="notes-list"></div>
    <div id="empty-state" class="empty-state">No notes yet. Start typing above!</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
